<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 553" width="820" height="553">
  <style>
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      dominant-baseline: middle;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #8b949e;
      dominant-baseline: middle;
      text-anchor: middle;
    }
  </style>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#010409" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Window Container -->
  <rect x="4" y="4" width="812" height="545" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1" filter="url(#shadow)" />

  <!-- Header / Titlebar -->
  <path d="M 4 14 Q 4 4 14 4 L 806 4 Q 816 4 816 14 L 816 38 L 4 38 Z"
        fill="#161b22" stroke="#30363d" stroke-width="1" />
  <line x1="4" y1="38" x2="816" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window Control Buttons -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Terminal Title -->
  <text x="410" y="21" class="title">tts-batch — local narration</text>

  <!-- Terminal Output -->
  <text x="24" y="62" class="code"><tspan fill="#58a6ff" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="500">cat examples/script.md</tspan></text>
  <text x="24" y="81" fill="#8b949e" class="code"># Short narration example</text>
  <text x="24" y="100" fill="#c9d1d9" class="code">Hello, world. This is a *short* narration.</text>
  <text x="24" y="119" fill="#d2a8ff" class="code">[pause 500ms]</text>
  <text x="24" y="138" fill="#d2a8ff" class="code">[speed 1.1]</text>
  <text x="24" y="157" fill="#c9d1d9" class="code">Use the sentence files in your video editor.</text>
  <text x="24" y="176" fill="#d2a8ff" class="code">[speed 1.0]</text>
  <text x="24" y="195" fill="#c9d1d9" class="code">Keep the timing manifest for captions.</text>
  <text x="24" y="233" class="code"><tspan fill="#58a6ff" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="500">tts-batch render examples/script.md --dry-run</tspan></text>
  <text x="24" y="252" class="code"><tspan fill="#ffa657">Segment 0001 [voice: (default), speed: 1.00]: </tspan><tspan fill="#c9d1d9">Hello, world.</tspan></text>
  <text x="24" y="271" class="code"><tspan fill="#ffa657">Segment 0002 [voice: (default), speed: 1.00]: </tspan><tspan fill="#c9d1d9">This is a short narration.</tspan></text>
  <text x="24" y="290" class="code"><tspan fill="#ffa657">Segment 0003 [voice: (default), speed: 1.10]: </tspan><tspan fill="#c9d1d9">Use the sentence files in your video editor.</tspan></text>
  <text x="24" y="309" class="code"><tspan fill="#ffa657">Segment 0004 [voice: (default), speed: 1.00]: </tspan><tspan fill="#c9d1d9">Keep the timing manifest for captions.</tspan></text>
  <text x="24" y="347" class="code"><tspan fill="#58a6ff" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="500">tts-batch render examples/script.md -o out/ --engine piper --voice en_US.onnx</tspan></text>
  <text x="24" y="366" fill="#56d364" font-weight="600" class="code">Rendered 4 segments (8.400s) to out/</text>
  <text x="24" y="404" class="code"><tspan fill="#58a6ff" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="500">ls -1 out/</tspan></text>
  <text x="24" y="423" fill="#79c0ff" class="code">0001.wav</text>
  <text x="24" y="442" fill="#79c0ff" class="code">0002.wav</text>
  <text x="24" y="461" fill="#79c0ff" class="code">0003.wav</text>
  <text x="24" y="480" fill="#79c0ff" class="code">0004.wav</text>
  <text x="24" y="499" fill="#f2cc60" class="code">manifest.json</text>
  <text x="24" y="518" fill="#7ee787" class="code">narration.wav</text>
</svg>
