name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install espeak-ng (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Install espeak-ng (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install espeak-ng
      - name: Install espeak (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: brew install espeak
      - name: Install package and lint tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test suite with coverage
        run: python -m pytest --cov=tts_batch --cov-report=term-missing
      - name: Build wheel and distribution
        run: python -m build
      - name: Verify package distribution
        run: python -m twine check --strict dist/*
      - name: Install wheel outside source tree
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          tts-batch --version
          python -c "from importlib.resources import files; assert files('tts_batch').joinpath('py.typed').is_file()"
      - name: Render smoke test with espeak (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          tts-batch render "${GITHUB_WORKSPACE}/examples/script.md" -o out --engine espeak
          python -c "import json; m = json.load(open('out/manifest.json')); assert len(m['sentences']) >= 3, len(m['sentences'])"
      - name: Render smoke test with espeak (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          tts-batch render "${GITHUB_WORKSPACE}/examples/script.md" -o out --engine espeak
          python -c "import json; m = json.load(open('out/manifest.json')); assert len(m['sentences']) >= 3, len(m['sentences'])"
      - name: Render smoke test with espeak (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          tts-batch render "${GITHUB_WORKSPACE}/examples/script.md" -o out --engine espeak
          python -c "import json; m = json.load(open('out/manifest.json')); assert len(m['sentences']) >= 3, len(m['sentences'])"
