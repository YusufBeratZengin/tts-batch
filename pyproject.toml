[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-batch"
version = "0.1.0"
description = "Local script narration with sentence audio and caption timing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yusuf Berat Zengin"}]
keywords = [
  "tts",
  "narration",
  "offline",
  "captions",
  "piper",
  "kokoro",
  "espeak",
  "text-to-speech",
  "subtitles",
  "video",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4,<0.10"]
dev = [
  "ruff>=0.11,<0.18",
  "mypy>=1.10",
  "build",
  "twine",
]

[project.scripts]
tts-batch = "tts_batch.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/tts-batch"
Source = "https://github.com/YusufBeratZengin/tts-batch"
Changelog = "https://github.com/YusufBeratZengin/tts-batch/blob/main/CHANGELOG.md"
Issues = "https://github.com/YusufBeratZengin/tts-batch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tts_batch = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/tts_batch"]

[[tool.mypy.overrides]]
module = ["kokoro", "kokoro.*", "spacy", "spacy.*"]
ignore_missing_imports = true
